[package]
name = "p2p-aggregator"
version = "0.1.0"
edition = "2021"
default-run = "p2p-aggregator"

[dependencies]
libp2p = { version = "0.53", features = [
    "tokio",
    "tcp",
    "noise",
    "yamux",
    "gossipsub",
    "macros",
    "dns",
    "mdns",
    "ecdsa"
] }
tokio = { version = "1.0", features = ["full"] }
rusqlite = "0.31"
ed25519-dalek = { version = "2.2", features = ["rand_core", "hazmat"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.6", features = ["v4"] }
hex = "0.4"
sha2 = "0.10"
crossterm = "0.27"
ratatui = "0.26"
rand = "0.8"
clap = { version = "4.4", features = ["derive"] }
bincode = "1.3"
toml = "0.8"
librqbit = "9.0.1"

[[test]]
name = "wot_integration_test"
path = "src/tests/wot_integration_test.rs"

[[test]]
name = "journal_recovery_test"
path = "src/tests/journal_recovery_test.rs"
