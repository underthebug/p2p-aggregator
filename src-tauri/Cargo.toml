[package]
name = "p2p-desktop"
version = "0.1.0"
edition = "2021"

[lib]
name = "p2p_desktop_lib"
path = "src/lib.rs"

[[bin]]
name = "p2p-desktop"
path = "src/main.rs"

[[bin]]
name = "p2p-daemon"
path = "src/bin/daemon.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
libp2p = { version = "0.53", features = ["tokio", "tcp", "noise", "yamux", "gossipsub", "mdns", "macros", "serde"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["fs", "cors"] }
reqwest = { version = "0.13.5", features = ["json"] }

[workspace]
