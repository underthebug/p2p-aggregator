[package]
name = "p2p-aggregator"
version = "0.1.0"
description = "Off-grid P2P Link Aggregator"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-shell = "2.5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.13.5", features = ["blocking", "json"] }

[dependencies.libp2p]
version = "0.53"
features = [
  "tokio",
  "gossipsub",
  "mdns",
  "kad",
  "tcp",
  "noise",
  "yamux",
  "upnp",
  "dcutr",
  "relay",
  "identify",
  "macros"
]

[lib]
name = "p2p_aggregator"
crate-type = ["staticlib", "cdylib", "rlib"]
