[package]
name = "p2p-aggregator"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
libp2p = { version = "0.53", features = ["tokio", "gossipsub", "mdns", "kad", "noise", "tcp", "yamux", "quic", "macros"] }
rusqlite = { version = "0.31.0", features = ["bundled"] }
rocksdb = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ed25519-dalek = { version = "2.1", features = ["serde", "rand_core"] }
rand = "0.8"
hex = "0.4"
chrono = "0.4"
futures = "0.3"
anyhow = "1.0"
sha2 = "0.10"
