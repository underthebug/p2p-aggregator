<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8"><title>Mesh Station - AI Node</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans h-screen flex flex-col overflow-hidden">
    <header class="bg-slate-900 border-b border-slate-800 px-6 py-3 flex items-center justify-between z-20">
        <div class="flex items-center space-x-3">
            <button id="sidebar-toggle" class="p-1.5 rounded bg-slate-800 text-slate-300 cursor-pointer">☰</button>
            <div class="w-3 h-3 bg-emerald-500 rounded-full animate-pulse"></div>
            <h1 class="text-lg font-bold tracking-wider">Mesh Station</h1>
        </div>
    </header>
    <div class="flex flex-1 overflow-hidden relative">
        <aside id="sidebar" class="w-64 bg-slate-900/90 border-r border-slate-800 p-4 space-y-2 flex flex-col justify-between z-10">
            <div class="space-y-2">
                <a href="index.html" class="flex items-center space-x-3 px-3 py-2 rounded-lg hover:bg-slate-800 text-slate-400"><span>📡</span><span>Mesh Comms</span></a>
                <a href="rtk_feed.html" class="flex items-center space-x-3 px-3 py-2 rounded-lg hover:bg-slate-800 text-slate-400"><span>🧠</span><span>R.T.K Feed</span></a>
                <a href="user_rss.html" class="flex items-center space-x-3 px-3 py-2 rounded-lg hover:bg-slate-800 text-slate-400"><span>🌐</span><span>User RSS Feeds</span></a>
                <a href="ai.html" class="flex items-center space-x-3 px-3 py-2 rounded-lg bg-blue-600/20 text-blue-400 border border-blue-500/30"><span>⚡</span><span>AI Node</span></a>
                <a href="radio.html" class="flex items-center space-x-3 px-3 py-2 rounded-lg hover:bg-slate-800 text-slate-400"><span>📻</span><span>Radio Streams</span></a>
            </div>
            <div class="bg-slate-950/60 p-3 rounded text-[11px] font-mono text-slate-400">
                <div class="flex items-center justify-between"><span>AI Engine LED</span><div class="w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse"></div></div>
            </div>
        </aside>
        <div id="collapsed-taskbar" class="w-14 bg-slate-900 border-r border-slate-800 py-4 flex flex-col items-center space-y-6 hidden z-10">
            <button id="expand-sidebar-btn" class="p-2 rounded text-slate-300 cursor-pointer">➔</button>
            <div class="flex flex-col space-y-4 items-center">
                <a href="index.html" title="Mesh">📡</a><a href="rtk_feed.html" title="R.T.K">🧠</a><a href="user_rss.html" title="RSS">🌐</a><a href="ai.html" title="AI">⚡</a><a href="radio.html" title="Radio">📻</a>
            </div>
        </div>
        <main class="flex-1 p-6 overflow-y-auto">
            <div class="max-w-4xl mx-auto space-y-6">
                <h2 class="text-xl font-bold">AI Inference & Multi-Agent Node</h2>
                <div class="bg-slate-900 border border-slate-800 rounded-lg p-5 space-y-4 font-mono text-xs">
                    <input type="text" value="http://localhost:11434/api/generate" class="w-full bg-slate-950 border border-slate-800 p-2.5 rounded text-slate-200" />
                    <input type="text" value="llama3.1:8b" class="w-full bg-slate-950 border border-slate-800 p-2.5 rounded text-slate-200" />
                    <button class="w-full py-2.5 bg-blue-600 text-white font-semibold rounded cursor-pointer">Run Inference</button>
                </div>
            </div>
        </main>
    </div>
    <script>
        const sb = document.getElementById('sidebar'), cb = document.getElementById('collapsed-taskbar');
        const toggle = () => { sb.classList.toggle('hidden'); cb.classList.toggle('hidden'); };
        document.getElementById('sidebar-toggle').onclick = toggle; document.getElementById('expand-sidebar-btn').onclick = toggle;
    </script>
</body>
</html>
