<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <title>Mesh Region Subscriptions</title>
    <style>
        body { margin: 0; background: #020617; color: #f8fafc; font-family: system-ui, sans-serif; height: 100vh; display: flex; overflow: hidden; }
        aside { width: 380px; background: #0f172a; border-right: 1px solid #1e293b; display: flex; flex-direction: column; padding: 24px; box-shadow: 10px 0 30px rgba(0,0,0,0.8); z-index: 10; overflow-y: auto; }
        main { flex-grow: 1; display: flex; flex-direction: column; padding: 40px; background: radial-gradient(circle at center, #0f172a 0%, #020617 100%); overflow-y: auto; }
        h3 { margin: 0 0 8px 0; color: #38bdf8; font-size: 18px; display: flex; align-items: center; gap: 8px; }
        p { font-size: 12px; color: #94a3b8; margin: 0 0 16px 0; }
        .back-btn { background: #1e293b; color: #94a3b8; border: 1px solid #334155; margin-bottom: 16px; text-align: center; text-decoration: none; padding: 8px; border-radius: 6px; font-size: 12px; font-weight: 500; display: block; }
        .back-btn:hover { background: #334155; color: #fff; }
        
        .region-card { background: #020617; border: 1px solid #1e293b; padding: 16px; border-radius: 8px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .region-info h4 { margin: 0 0 4px 0; color: #38bdf8; font-size: 14px; }
        .region-info span { font-size: 11px; color: #64748b; }
        
        .actions-group { display: flex; gap: 8px; }
        .btn-quiet { background: #334155; color: #cbd5e1; border: none; padding: 6px 12px; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; }
        .btn-quiet.muted { background: #d97706; color: #fff; }
        .btn-remove { background: #7f1d1d; color: #fca5a5; border: none; padding: 6px 12px; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; }
        .btn-remove:hover { background: #991b1b; }

        input { background: #0f172a; border: 1px solid #334155; color: #fff; padding: 8px 10px; border-radius: 6px; font-size: 12px; width: 100%; box-sizing: border-box; margin-bottom: 10px; }
        button.add-btn { background: #3b82f6; color: #fff; border: none; padding: 8px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 12px; width: 100%; }
        button.add-btn:hover { background: #2563eb; }
    </style>
</head>
<body>
    <aside>
        <a href="/" class="back-btn">&#8592; Back to Dashboard</a>
        <h3>🌐 Region Subscriptions</h3>
        <p>Manage relay zones, quiet feeds, or remove subscriptions.</p>

        <div style="background: #020617; border: 1px solid #1e293b; padding: 14px; border-radius: 8px;">
            <div style="font-size: 12px; font-weight: bold; color: #f8fafc; margin-bottom: 8px;">Add Region Relay</div>
            <input type="text" id="reg-name" placeholder="Region Name (e.g. Europe-West)">
            <input type="text" id="reg-node" placeholder="Node Address / Relay URL">
            <button class="add-btn" onclick="addRegion()">Subscribe Region</button>
        </div>
    </aside>

    <main>
        <div style="font-size: 20px; font-weight: bold; color: #f8fafc; margin-bottom: 4px;">Subscribed Mesh Regions</div>
        <p style="margin-bottom: 24px;">Configure active regional feeds, toggle quiet status, or unsubscribe nodes.</p>
        <div id="regions-list"></div>
    </main>

    <script>
        let regions = [
            { id: 1, name: "North America (Pottstown Node)", status: "Active", muted: false },
            { id: 2, name: "Global Relay #1", status: "Active", muted: false },
            { id: 3, name: "Europe-Central Mesh", status: "Active", muted: true }
        ];

        function renderRegions() {
            const list = document.getElementById('regions-list');
            list.innerHTML = '';
            regions.forEach(reg => {
                const card = document.createElement('div');
                card.className = 'region-card';
                card.innerHTML = `
                    <div class="region-info">
                        <h4>${reg.name}</h4>
                        <span>Status: <strong style="color: ${reg.muted ? '#d97706' : '#10b981'}">${reg.muted ? 'Muted / Quiet' : 'Active'}</strong></span>
                    </div>
                    <div class="actions-group">
                        <button class="btn-quiet ${reg.muted ? 'muted' : ''}" onclick="toggleMute(${reg.id})">${reg.muted ? 'Unmute' : 'Quiet'}</button>
                        <button class="btn-remove" onclick="removeRegion(${reg.id})">Remove</button>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        function toggleMute(id) {
            regions = regions.map(r => r.id === id ? { ...r, muted: !r.muted } : r);
            renderRegions();
        }

        function removeRegion(id) {
            regions = regions.filter(r => r.id !== id);
            renderRegions();
        }

        function addRegion() {
            const name = document.getElementById('reg-name').value.trim();
            if (!name) return alert('Please enter a region name.');
            regions.push({ id: Date.now(), name, status: "Active", muted: false });
            document.getElementById('reg-name').value = '';
            document.getElementById('reg-node').value = '';
            renderRegions();
        }

        renderRegions();
    </script>
</body>
</html>
